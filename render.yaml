databases:
  - name: datacollector-db
    plan: free
    region: frankfurt
    databaseName: datacollector
    user: datacollector

services:
  - type: web
    name: datacollector
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: uv sync --frozen && uv run python manage.py collectstatic --no-input && uv run python manage.py migrate && (uv run python manage.py createsuperuser --noinput || true)
    startCommand: uv run python -m gunicorn DataCollector.asgi:application -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT
    healthCheckPath: /admin/login/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: datacollector-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: "1"
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
